# The registry of Windjammer's language features (checked by tools/docs_truth/book_features.rs).
#
# * `families`: the spec rule families (SPEC-<FAMILY>-nnn in docs/spec/*.md) the feature owns. Every family defined by a
#   spec chapter must appear here, so a feature added to the specification cannot go unlisted.
# * A book page that teaches the feature carries `<!-- feature: ID -->`; `[book] max_uncovered_features` in
#   docs/docs-truth.toml counts the entries no page covers and may only shrink.

[[feature]]
id = "lexical-structure"
title = "Tokens, comments, literals, escapes"
families = ["LEX"]
spec = "docs/spec/lexical.md"

[[feature]]
id = "grammar"
title = "The checked grammar"
families = ["GRAM"]
spec = "docs/spec/grammar.md"

