# Promise registry: everything Windjammer tells users it does. Read by tests/promise_registry_test.rs
# (see docs/testing/INVARIANTS.md, "Promise registry").
#
# - `wj <sub>` / `wj <sub> --<flag>` entries must match the clap tree of `wj` exactly; `code X` entries
#   must match docs/reference/errors.md. A new flag, command or code fails the gate until it is listed here
#   and has acceptance cases (PROMISES_BLESS=1 appends missing entries as pending).
# - `feature <id>` entries quote the sentence that makes the promise; the quote must stay in `source`.
# - Every promise needs >=1 positive and >=1 negative acceptance case in tests/promises/*.toml that passes
#   through the installed binary (codes: >=1 negative case whose expected output contains the code).
# - `pending = "reason"` marks a promise without tests yet. `max_pending` is a ratchet: it only shrinks.

max_pending = 38

