# The Windjammer built-in std surface: the single source of truth (ADR-0039).
#
# Every built-in method, intrinsic and literal form a program can write without an import is one row of `methods`;
# every spelling the language no longer accepts is one row of `removed`. Everything else is derived from or checked
# against this file:
#
#   agent_index/builtins.txt              generated (`wj agent-index`), never edited by hand
#   `wj docs` / the agent index           read the generated index
#   src/stdlib_surface/known_methods.rs   the canonical names are a subset of it (checked)
#   src/stdlib_surface/enumerable.rs      the `seq` rows with `kind = "enumerable"` (checked)
#   src/interpreter/builtins/*.rs         every registered (type, method) is a canonical row or `internal` (checked)
#   std/rust_core.wji                     every row's `lower` names a declared Rust core method (checked)
#   tests/list_method_lowering_typechecks_test.rs and its per-type siblings: one row per canonical method (checked)
#   WJ0180 (removed std form)             its fix hint and machine-applicable edit come from `removed`
#   `wj fix`                              rewrites every `removed` row with `fix = "auto"` or `fix = "typed"`
#   scripts/wj/std_inventory.wj           counts every `removed` row's `pattern` across the corpora
#
# Gate (tests/std_surface_test.rs, shrink-only): `methods` may grow only with a doc line, a verified example and a
# lowering row; `removed` rows are permanent (they are the fix-hint table); docs/generated/std_removal_inventory.tsv
# counts may only fall until every count outside `docs/adr/` and `tests/removed_forms/` is 0.
#
# Fields of `methods`:
#   type     receiver: intrinsic, literal, seq (every sequence: Vec, VecDeque, HashSet, HashMap as (k, v) pairs,
#            ranges, Iter), Vec, VecDeque, Iter, string, char, int (every integer type), float (f32, f64), Option,
#            Result, HashMap, BTreeMap, HashSet, BTreeSet, Entry
#   name     method name (as written after the dot), or the intrinsic / literal form
#   sig      the signature as a reader writes the call; `int` is the default integer type (ADR-0039 decision B)
#   summary  one line for `wj docs`
#   kind     method (default) | enumerable (src/stdlib_surface/enumerable.rs) | operator | literal | intrinsic
#   lower    the Rust core method it lowers to (std/rust_core.wji), when the name differs or the lowering adapts
#   mutates  true when the receiver must be `let mut`
#   aka      the row name the hand-written agent index used before it was generated (migration only)
# Fields of `removed`:
#   id           stable identifier (R###), quoted in WJ0180
#   form         what the program wrote
#   pattern      PCRE matched against source text by the inventory (approximate: also matches inside strings/comments)
#   replacement  the canonical form
#   action       error (WJ0180 with this hint, a catalog example and an oracle case) | delete (absent; the generic
#                unknown-method error still quotes this row's replacement as its hint)
#   fix          auto (lexical, always safe) | typed (needs the checker's receiver type) | manual (reported, not rewritten)
#   note         optional: behaviour change or reason

