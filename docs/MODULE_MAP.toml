# Library API that no driver (wj, wj-lint, LSP, MCP) reaches on purpose: "src path prefix" = "who uses it".
# Read by tests/capability_reachability_test.rs (dead-capability gate); everything else must be reachable.
[library_api]
"src/codegen/rust/copy_semantics.rs" = "Rust auto-deref/auto-copy model (CopySemantics, DerefContext): specified by copy_semantics_test and rust_coercion_rules_test, not yet consulted by codegen"
"src/type_registry.rs" = "type name -> defining module registry: specified by the type_registry_* tests, not yet consulted by import generation"
"src/ffi/" = "experimental C header / IDL generation from module metadata (WJ-IMPL-02, ADR-0012); no `wj` command exposes it yet"
"src/test_utils.rs" = "arena AST builders for integration tests"
"src/parser/ast/builders.rs" = "AST constructors (type_*, expr_*, stmt_*) used by integration tests to build programs without parsing"
"src/lexer/keywords.rs" = "keyword table: source of docs/reference/keywords.md (wj-docs) and pinned to the lexer by tests"
