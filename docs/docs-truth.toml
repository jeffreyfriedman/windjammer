# docs-truth configuration (see docs/CONTRIBUTING-docs.md). Checked by tests/docs_truth_test.rs.
# Exclusions need a reason. Baselines are ratchets: they may only shrink; `wj-docs update-baseline`
# rewrites the [baseline.*] tables at the end of this file.

[[exclude]]
check = "all"
glob = "docs/archive/**"
reason = "historical documents, kept as written"

[[exclude]]
check = "all"
glob = "tests/py_ports/**"
reason = "recorded replay fixtures: copies of other repositories' documents and deliberately broken inputs, compared byte for byte by their own gate"

[[exclude]]
check = "claims"
glob = "bench/agent-dx/results/**"
reason = "benchmark result records: report.md is produced by `agentdx pilot6-report` from report.json (plus the recorded notes.md it appends), every number is as of that run and is pinned by the harness tests; the book and docs quote them through generated regions"

[[exclude]]
check = "claims"
glob = "docs/RELEASE_SCORECARD.md"
reason = "generated by scripts/wj/release_scorecard.wj from repository files and results files; `release_scorecard.wj --check` proves every number on the page matches docs/generated/release_scorecard.json"

[[exclude]]
check = "claims"
glob = "CHANGELOG.md"
reason = "release notes record numbers as of their release"

[[exclude]]
check = "claims"
glob = "bench/agent-dx/results/**"
reason = "agent-pilot reports and notes record the numbers of one recorded run (the trial records beside them are the data); the live cost proxies are in docs/generated/measured.json"

[[exclude]]
check = "claims"
glob = "docs/drift/pilot*-findings.md"
reason = "findings of one recorded agent pilot, dated and tied to its trial records"

[[exclude]]
check = "fences"
glob = "CHANGELOG.md"
reason = "release notes quote the syntax as it was at their release"

[[exclude]]
check = "links"
glob = "CHANGELOG.md"
reason = "release notes name files, commands and docs as they were at their release; many were deleted or renamed since"

[[exclude]]
check = "links"
glob = "docs/adr/0021-effects-and-capabilities.md"
reason = "accepted for design with a staged implementation (E1-E7): the commands, flags and test files it names are the plan, not current behaviour"

[[exclude]]
check = "links"
glob = "docs/adr/0039-stdlib-one-way.md"
reason = "proposed std redesign with a staged migration (S1-S9): WJ0180, the new gate tests, the new source files and the generator flags it names are the plan, not current behaviour"

[[exclude]]
check = "links"
glob = "docs/spec/effects.md"
reason = "rules marked [PLANNED] name commands, flags and acceptance tests that arrive with stages E1-E7"

[[exclude]]
check = "fences"
glob = "docs/adr/0021-effects-and-capabilities.md"
reason = "design sketches of planned syntax (effect declarations, durable processes) that the parser does not accept yet"

[freshness]
tracked = ["docs/adr/0*.md", "docs/design/*.md"]
changed_lines = 200
require = true

# Shell fences that run `wj` in these documents must be `sh,verify` (executed in CI with the built wj).
[verify]
required = ["docs/book/src/**/*.md", "README.md", "AGENTS.md", "docs/agent/WINDJAMMER_FOR_AGENTS.md", "docs/agent/WINDJAMMER_REFERENCE.md", "examples/README.md", "examples/*/README.md", "templates/*/README.md"]

# The Windjammer Book (docs/book, tools/docs_truth/book.rs). Every value is a ratchet: it may only shrink, and a
# value above the measured count fails too, so the file always states the truth.
[book]
max_ignored = 0
max_interpreter_only = 4
max_drafts = 0
max_uncovered_promises = 0
max_uncovered_features = 0

# Rule-id namespaces: ids cited in docs must be defined in the matching files. A namespace is
# inactive until at least one defining file exists.
[[rule_ids]]
prefix = "SPEC-"
defs = "docs/spec/**/*.md"

# docs/windjammer.ebnf is cross-checked against the parser (tools/docs_truth/ebnf.rs, docs/CONTRIBUTING-docs.md).
# Lexer keywords deliberately absent from the grammar: "keyword" = "reason". May only shrink.
[ebnf.unlisted_keywords]

# Grammar sentences the parser rejects: "production#alternative" = "reason". An entry the parser accepts fails the check.
[ebnf.divergences]

