# Heuristic-surface ratchet baseline. Read by tests/heuristic_surface_test.rs.
# Per-file counts may only go DOWN. Lower them after a deletion with
#   cargo test --test all heuristic_surface_test::regenerate_heuristic_baseline -- --ignored
# and update the published totals in docs/spec/convergence-burndown.md.
# [conventions]: names a literal may spell without counting; each must be documented
# (in backticks) in the doc it points to.

