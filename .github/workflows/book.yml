name: Book

# Builds The Windjammer Book (docs/book) and publishes it to GitHub Pages from main.
# Every program in the book is run first, interpreted and compiled, so a page never ships with a broken example.

on:
  push:
    branches: [main]
    paths: ['docs/book/**', 'docs/promises.toml', 'docs/spec/grammar.ebnf', 'std/**', 'src/**', 'tools/docs_truth/**', 'scripts/book/**', '.github/workflows/book.yml']
  pull_request:
    paths: ['docs/book/**', 'tools/docs_truth/**', 'scripts/book/**', '.github/workflows/book.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: book-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Book gates (structure, links, promise coverage, generated pages, every sample interpreted and compiled)
        run: |
          cargo test --release --features cli --test book
          cargo test --release --features cli --test docs_truth

      - name: Build the book
        run: mdbook build docs/book

      - name: Set up Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
