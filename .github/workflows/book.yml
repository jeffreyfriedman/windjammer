name: Book

# Builds The Windjammer Book (docs/book) and publishes it to GitHub Pages from main.
# Every program in the book is run first, interpreted and compiled, so a page never ships with a broken example.

on:
  push:
    branches: [main]
    paths: ['docs/book/**', 'crates/windjammer-playground/**', 'docs/promises.toml', 'docs/spec/grammar.ebnf', 'std/**', 'src/**', 'tools/docs_truth/**', 'scripts/book/**', '.github/workflows/book.yml']
  pull_request:
    paths: ['docs/book/**', 'crates/windjammer-playground/**', 'src/interpreter/**', 'std/**', 'tools/docs_truth/**', 'scripts/book/**', '.github/workflows/book.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.40

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: book-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Book gates (structure, links, promise coverage, generated pages, every sample interpreted and compiled)
        run: |
          cargo test --release --features cli --test book
          cargo test --release --features cli --test docs_truth

      # ADR-0034: the interpreter compiled to wasm32 must print what the native interpreter prints on every sample of the
      # book (single files and multi-file projects), exit status included, and the TypeScript sandbox must match node.
      # scripts/book/playground_check.wj builds the wasm, extracts the samples and runs both interpreters on each.
      - name: Set up Node (the playground hosts and TypeScript type stripping need Node 22.6 or later)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playground parity (wasm interpreter against the native interpreter on every book sample)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --features cli --bin wj --bin wj-docs
          ./target/release/wj run --interpret scripts/book/playground_check.wj -- ./target/release/wj ./target/release/wj-docs "$RUNNER_TEMP/playground-check"

      - name: Build the book
        run: mdbook build docs/book

      # The playground (ADR-0034) is a static page next to the book: the interpreter compiled to WebAssembly, the Worker
      # and the TypeScript sandbox. The pages' "Run" links point at it; the browser tests stay out of the site.
      - name: Build the playground interpreter and add it to the site
        run: |
          rustup target add wasm32-unknown-unknown
          (cd crates/windjammer-playground && cargo build --release --target wasm32-unknown-unknown)
          mkdir -p target/book/playground
          cp -R docs/book/playground/. target/book/playground/
          rm -rf target/book/playground/tests
          cp crates/windjammer-playground/target/wasm32-unknown-unknown/release/windjammer_playground.wasm target/book/playground/

      - name: Set up Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
