[package]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
edition = "2025"

[dependencies]
# HTTP and async support (auto-included via std.http)
# reqwest = "0.11"
# tokio = { version = "1", features = ["full"] }

# JSON serialization (auto-included via std.json)
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"

# Add your additional dependencies here

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true

# Capabilities (ADR-0021): what this program may reach. The template calls one API and (commented out) serves
# on a port; `wj run` stops anything else with exit status 126 and prints the line to add.
[capabilities]
fs.read = ["./**"]
fs.write = ["./**"]
net.connect = ["jsonplaceholder.typicode.com"]
# net.listen = ["0.0.0.0:8080"]
