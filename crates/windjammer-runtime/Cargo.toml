[package]
name = "windjammer-runtime"
version.workspace = true
edition = "2021"
authors.workspace = true
description = "Runtime library for Windjammer standard library implementations"
license.workspace = true
repository = "https://github.com/jeffreyfriedman/windjammer"

[features]
# Generated programs start from `default-features = false` and enable only the groups their code
# references (src/cargo_toml/runtime_features.rs); the default set is everything.
default = ["db", "full"]
full = ["net", "async", "cli", "crypto", "datetime", "jwt", "regex", "parallel", "yaml", "compress", "csv", "log"]
server = ["tower", "tower-http"]
async = ["dep:tokio"]
net = ["async", "dep:axum", "dep:reqwest"]
db = ["async", "dep:sqlx"]
cli = ["dep:clap"]
crypto = ["dep:argon2", "dep:bcrypt", "dep:sha1", "dep:sha2"]
datetime = ["dep:chrono"]
jwt = ["datetime", "dep:jsonwebtoken"]
regex = ["dep:regex"]
parallel = ["dep:rayon"]
yaml = ["dep:serde_yaml", "dep:toml"]
compress = ["dep:flate2"]
csv = ["dep:csv"]
log = ["dep:log", "dep:env_logger"]
wasm = ["wasm-bindgen", "web-sys", "js-sys", "console_error_panic_hook", "wasm-bindgen-futures"]
# Tracy profiler zones (`@profile("…")` in Windjammer → `windjammer_runtime::profiling::tracy_zone`).
tracy = ["dep:tracy-client"]

[dependencies]
# HTTP Client & Server (axum/tokio always included for std::http server)
axum = { version = "0.8", features = ["macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["fs", "trace"], optional = true }

# JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# MIME types
mime_guess = "2.0"

# File system (uses std::fs, no extra deps needed)

# Async runtime
async-trait = "0.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.21"

# URL parsing
url = "2.5"

# Additional stdlib modules
clap = { version = "4.5", features = ["derive"], optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
bcrypt = { version = "0.17", optional = true }
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"], optional = true }
uuid = { version = "1", features = ["v4", "v7"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", default-features = false, features = ["parse"], optional = true }
base64 = "0.21"
hex = "0.4"
urlencoding = "2.1"
dirs = "5.0"
csv = { version = "1.3", optional = true }
flate2 = { version = "1.0", optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "postgres"], default-features = false, optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
regex = { version = "1.10", optional = true }
chrono = { version = "0.4", optional = true }
jsonwebtoken = { version = "9", optional = true }

# Arenas (std::arena Scratch)
bumpalo = { version = "3.19", features = ["collections"] }

# Parallel computation
rayon = { version = "1.8", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

# Optional: Tracy profiler (feature `tracy`)
tracy-client = { version = "0.18", optional = true, default-features = false, features = ["enable"] }

# Web/WASM support for UI
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Text",
    "Window",
    "Event",
    "EventTarget",
    "MouseEvent",
    "KeyboardEvent",
    "InputEvent",
    "HtmlInputElement",
    "HtmlButtonElement",
    "DomTokenList",  # For classList
    "console",       # For console logging
    "Storage",       # For localStorage
    "Worker",        # For Web Workers
    "MessageEvent",  # For Worker messages
    "Navigator",     # For hardwareConcurrency
    "WebSocket",     # For WebSocket support
    "Request",       # For Fetch API
    "Response",      # For Fetch API
    "RequestInit",   # For Fetch API
    "Headers",       # For Fetch API
], optional = true }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

# Platform-specific dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }

# Lints configuration
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
