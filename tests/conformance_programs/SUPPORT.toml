# `&mut int` parameters / `let r = &mut z` locals: the Go and JS backends pass integers by value
# and the Rust backend infers the parameter as an owned i64 (E0614 on `*c`).
[[unsupported]]
program = "159_deref_assign_ref_params"
backend = "rust"
reason = "mut-ref-to-int-parameters: Rust backend emits an owned i64 parameter so `*c = ..` fails with E0614"

[[unsupported]]
program = "170_mut_ref_value_types"
backend = "rust"
reason = "mut-ref-to-int-parameters: Rust backend emits owned i64/f64/bool parameters for `&mut` scalars so `*c = ..` fails with E0614"

[[unsupported]]
program = "173_type_aliases"
backend = "rust"
reason = "rust-int-literal-width-inference: `Alias::new(3, 4)` through a `type` alias types the literals i32 against an i64 signature (E0308); see docs/known-issues/rust-int-literal-width-inference.md"

[[unsupported]]
program = "174_closure_mut_capture"
