# Acceptance cases for `wj check` (tests/promise_registry_test.rs).

[[case]]
name = "check accepts a valid program"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let n = 40 + 2\n    println(\"n=${n}\")\n}\n" }
args = ["check", "{w}/m.wj"]
output_has = ["0 error(s)"]

[[case]]
name = "check rejects a syntax error"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["check", "{w}/m.wj"]
exit = 1
output_has = ["expected parameter name", "m.wj:1:10"]

[[case]]
name = "check with no path checks the current directory"
polarity = "positive"
files = { "src/main.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["check"]
output_has = ["0 error(s)"]

[[case]]
name = "check with no path finds errors in the current directory"
polarity = "negative"
files = { "src/main.wj" = "fn main() {\n    let s = \"unterminated\n}\n" }
args = ["check"]
exit = 1

[[case]]
name = "check --json emits machine-readable success"
polarity = "positive"
covers = ["feature json-diagnostics"]
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
json = true
stdout_has = ["\"success\": true", "\"schema_version\""]

[[case]]
name = "check --json reports lint codes with spans"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = [1, 2]\n    let w = v.clone()\n    println(\"${w.len()}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 0
json = true
stdout_has = ["\"code\": \"W0005\"", "\"line_start\""]

[[case]]
name = "check --json puts a lint diagnostic on the right line"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = [1, 2]\n    let w = v.clone()\n    println(\"${w.len()}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 0
stdout_has = ["\"line_start\": 3"]

[[case]]
name = "check --json reports a syntax error as success=false"
polarity = "negative"
covers = ["feature json-diagnostics"]
files = { "m.wj" = "fn main( {\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
json = true
stdout_has = ["\"success\": false", "expected parameter name"]

[[case]]
name = "check rejects a string assigned to an int"
polarity = "negative"
covers = ["feature json-diagnostics"]
files = { "m.wj" = "fn main() {\n    let x: int = \"s\"\n    println(\"${x}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0003\""]

[[case]]
name = "check rejects a char from strings.chars compared with a string literal"
polarity = "negative"
files = { "m.wj" = "use std::strings\n\nfn main() {\n    for ch in strings.chars(\"a?b\") {\n        if ch == \"?\" {\n            println(\"q\")\n        }\n    }\n}\n" }
args = ["check", "{w}/m.wj"]
exit = 1
output_has = ["WJ0003", "expected `char`, found `string`", "'?'"]

[[case]]
name = "check accepts a char compared with a char literal"
polarity = "positive"
files = { "m.wj" = "use std::strings\n\nfn main() {\n    for ch in strings.chars(\"a?b\") {\n        if ch == '?' {\n            println(\"q\")\n        }\n    }\n}\n" }
args = ["check", "{w}/m.wj"]
output_has = ["0 error(s)"]

[[case]]
name = "check rejects an undefined variable (WJ0001)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let y = undefined_thing + 1\n    println(\"${y}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["WJ0001"]

[[case]]
name = "check --json keeps the code of a W0010 error"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let n: String = \"x\"\n    println(\"${n}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"W0010\""]

[[case]]
name = "check reports deprecated macro spelling (W0007)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = vec![1, 2]\n    println(\"${v.len()}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 0
stdout_has = ["\"code\": \"W0007\""]

[[case]]
name = "check reports a {}-style format string (W0008)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let n = 1\n    println(\"n={}\", n)\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 0
stdout_has = ["\"code\": \"W0008\""]

[[case]]
name = "check rejects the Rust String type (W0010)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let n: String = \"x\"\n    println(\"${n}\")\n}\n" }
args = ["check", "{w}/m.wj"]
exit = 1
output_has = ["W0010"]

[[case]]
name = "check rejects a call to an undefined function (WJ0002)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let n = frobnicate(1)\n    println(\"${n}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0002\""]

[[case]]
name = "check rejects a struct literal with a missing field (WJ0009)"
polarity = "negative"
files = { "m.wj" = "struct P {\n    x: int,\n    y: int,\n}\n\nfn main() {\n    let p = P { x: 1 }\n    println(\"${p.x}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0009\""]

[[case]]
name = "check rejects a non-exhaustive match (WJ0010)"
polarity = "negative"
files = { "m.wj" = "enum E {\n    A,\n    B,\n}\n\nfn main() {\n    let e = E::A\n    match e {\n        E::A => println(\"a\"),\n    }\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0010\""]

[[case]]
name = "check rejects a local changed without mut (WJ0051), with its fix"
polarity = "negative"
files = { "m.wj" = "struct Counter {\n    n: int,\n}\nimpl Counter {\n    fn bump(self) {\n        self.n = self.n + 1\n    }\n}\nfn main() {\n    let c = Counter { n: 0 }\n    c.bump()\n    println(\"${c.n}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0051\"", "\"replacement\": \"mut \""]

[[case]]
name = "check --fix applies machine-applicable rewrites"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let v = vec![1, 2]\n    println!(\"{}\", v.len())\n}\n" }
args = ["check", "--fix", "{w}/m.wj"]
file_has = { "m.wj" = "println(\"${v.len()}\")" }
output_has = ["2 edit(s) applied"]

[[case]]
name = "check --fix leaves a file with errors failing"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["check", "--fix", "{w}/m.wj"]
exit = 1
output_has = ["0 edit(s) applied"]

[[case]]
name = "check accepts interpolating a type that defines to_string"
polarity = "positive"
files = { "m.wj" = "struct P { x: int }\n\nimpl P {\n    fn to_string(self) -> string {\n        \"(${self.x})\"\n    }\n}\n\nfn main() {\n    let p = P { x: 1 }\n    println(\"${p}\")\n}\n" }
args = ["check", "{w}/m.wj"]
exit = 0

[[case]]
name = "check accepts a local declared mut that the program changes (WJ0051)"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let mut v = Vec::new()\n    v.push(1)\n    println(\"${v.len()} WJ0051-free\")\n}\n" }
args = ["check", "{w}/m.wj"]
output_has = ["0 error(s)"]

[[case]]
name = "check --error-format agent prints one line per diagnostic with its fix"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = vec![1, 2]\n    println(\"${v.len()} ${missing}\")\n}\n" }
args = ["check", "--error-format", "agent", "{w}/m.wj"]
exit = 1
output_has = ["m.wj:3:27: error WJ0001: cannot find value `missing`", "m.wj:2:13: warning W0007", "| fix(auto: wj check --fix)"]

[[case]]
name = "check --error-format agent on a valid program prints no diagnostics"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["check", "--error-format", "agent", "{w}/m.wj"]
output_has = ["0 error(s)"]

[[case]]
name = "check --error-format rejects an unknown format"
polarity = "negative"
files = { "m.wj" = "fn main() {}\n" }
args = ["check", "--error-format", "terse", "{w}/m.wj"]
exit = 2
output_has = ["possible values"]

[[case]]
name = "check warns that $${ prints the braces literally (W0017)"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let d = 4\n    println(\"$${d}.50\")\n}\n" }
args = ["check", "--error-format", "agent", "{w}/m.wj"]
exit = 0
output_has = ["warning W0017", "| fix: replace `$${` with `\\$${`"]

[[case]]
name = "check reports `mut self` as one coded WJ0011 with a machine-applicable fix"
polarity = "negative"
files = { "m.wj" = "struct Acc {\n    total: int,\n}\n\nimpl Acc {\n    fn add(mut self, x: int) {\n        self.total += x\n    }\n}\n\nfn main() {\n    let mut a = Acc { total: 0 }\n    a.add(1)\n    println(\"${a.total}\")\n}\n" }
args = ["check", "{w}/m.wj"]
exit = 1
output_has = ["error[WJ0011]", "`mut self` is not Windjammer", "m.wj:6:12", "remove `mut`", "fix (auto-fixable)"]
output_lacks = ["Parse error", "(at line"]

[[case]]
name = "check --fix deletes the `mut` of `mut self`"
polarity = "positive"
files = { "m.wj" = "struct Acc {\n    total: int,\n}\n\nimpl Acc {\n    fn add(mut self, x: int) {\n        self.total += x\n    }\n}\n\nfn main() {\n    let mut a = Acc { total: 0 }\n    a.add(1)\n    println(\"${a.total}\")\n}\n" }
args = ["check", "--fix", "{w}/m.wj"]
file_has = { "m.wj" = "fn add(self, x: int)" }
output_has = ["1 edit(s) applied"]

[[case]]
name = "check --error-format agent shows the `mut self` fix on one line"
polarity = "negative"
files = { "m.wj" = "struct Acc {\n    total: int,\n}\n\nimpl Acc {\n    fn add(mut self, x: int) {\n        self.total += x\n    }\n}\n\nfn main() {\n    let mut a = Acc { total: 0 }\n    a.add(1)\n    println(\"${a.total}\")\n}\n" }
args = ["check", "--error-format", "agent", "{w}/m.wj"]
exit = 1
output_has = ["m.wj:6:12: error WJ0011: `mut self` is not Windjammer", "| fix(auto: wj check --fix): remove `mut` => delete 6:12-6:16"]

[[case]]
name = "check --error-format agent shows where the WJ0051 `mut` goes"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let cur = 0\n    cur += 1\n    println(\"${cur}\")\n}\n" }
args = ["check", "--error-format", "agent", "{w}/m.wj"]
exit = 1
output_has = ["m.wj:3:5: error WJ0051", "| fix(auto: wj check --fix): declare `cur` as `mut` => insert `mut ` at 2:9"]

[[case]]
name = "check rejects untrusted data reaching a command (WJ0173), naming source, sink and remedy"
polarity = "negative"
files = { "m.wj" = "use std::fs\nuse std::process\n\nfn main() {\n    let name = fs::read_to_string(\"name.txt\").unwrap_or(\"\")\n    let out = process::run(\"echo ${name}\")\n    println(\"${out}\")\n}\n" }
args = ["check", "--json", "{w}/m.wj"]
exit = 1
stdout_has = ["\"code\": \"WJ0173\"", "file contents", "run_with_args"]

[[case]]
name = "check accepts the same flow once the value is an argument, not a command (WJ0173)"
polarity = "positive"
files = { "m.wj" = "use std::fs\nuse std::process\n\nfn main() {\n    let name = fs::read_to_string(\"name.txt\").unwrap_or(\"\")\n    let out = process::run_with_args(\"echo\", [name])\n    println(\"${out}\")\n}\n" }
args = ["check", "{w}/m.wj"]
output_has = ["0 error(s)"]
