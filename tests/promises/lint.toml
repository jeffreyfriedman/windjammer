# Acceptance cases for `wj lint` (tests/promise_registry_test.rs).

[[case]]
name = "lint passes idiomatic code"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let v = [3, 1, 2]\n    println(\"${v.len()}\")\n}\n" }
args = ["lint", "{w}/m.wj"]
output_has = ["No issues found"]

[[case]]
name = "lint reports every Rust-leakage code"
polarity = "negative"
exit = 1
files = { "m.wj" = "fn total(v: Vec<int>) -> int {\n    let mut s = 0\n    for x in v.iter() {\n        s = s + x\n    }\n    s\n}\nfn show(s: string) {\n    println(s)\n}\nfn first(x: &string) -> int {\n    let n = Some(1).unwrap()\n    n\n}\nfn main() {\n    let v = [1, 2]\n    let w = v.clone()\n    let t = \"hi\".to_string()\n    show(&t)\n    println(\"${total(w)}\")\n}\n" }
args = ["lint", "{w}/m.wj"]
output_has = ["[W0001]", "[W0002]", "[W0003]", "[W0004]", "[W0005]", "[W0006]"]

[[case]]
name = "lint --strict passes clean code"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["lint", "--strict", "{w}/m.wj"]

[[case]]
name = "lint --strict fails on findings"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = [1]\n    let w = v.clone()\n    println(\"${w.len()}\")\n}\n" }
args = ["lint", "--strict", "{w}/m.wj"]
exit = 1
output_has = ["W0005"]

[[case]]
name = "lint of a missing path fails"
polarity = "negative"
args = ["lint", "{w}/nope.wj"]
output_has = ["Path does not exist"]

[[case]]
name = "lint fails on error-level findings without --strict"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let n = Some(1).unwrap()\n    println(\"${n}\")\n}\n" }
args = ["lint", "{w}/m.wj"]
exit = 1

[[case]]
name = "lint reports the line of an unwrap"
polarity = "negative"
xfail = "BUG: W0002 is reported one line below the `.unwrap()` call"
exit = 1
files = { "m.wj" = "fn main() {\n    let n = Some(1).unwrap()\n    println(\"${n}\")\n}\n" }
args = ["lint", "{w}/m.wj"]
output_has = ["m.wj:2:"]

[[case]]
name = "lint reports W0010 for the Rust String type"
polarity = "negative"
xfail = "BUG: `wj lint` says `No issues found` for `let n: String` (W0010 is only raised by the compile path)"
exit = 0
files = { "m.wj" = "fn main() {\n    let n: String = \"x\"\n    println(\"${n}\")\n}\n" }
args = ["lint", "{w}/m.wj"]
output_has = ["W0010"]
