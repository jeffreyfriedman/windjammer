files = { "m.wj" = "fn main() {\n    let mut t: i32 = 1\n    let mut i = 0\n    while i < 300 {\n        t = t * 3\n        i += 1\n    }\n    println(\"${t}\")\n}\n" }
args = ["run", "--interpret", "--jit-loop-hot", "0", "--jit-debug", "{w}/m.wj"]
exit = 101
output_has = ["attempt to multiply with overflow"]

