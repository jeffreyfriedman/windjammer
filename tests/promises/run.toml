# Acceptance cases for `wj run` and `wj repl` (tests/promise_registry_test.rs).

[[case]]
name = "run --interpret executes a file instantly"
polarity = "positive"
covers = ["feature interpret-instant"]
files = { "m.wj" = "fn main() {\n    let v = [3, 1, 2]\n    println(\"len=${v.len()}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
stdout_has = ["len=3"]

[[case]]
name = "run --interpret passes program arguments"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let args = std::env::args()\n    println(\"argc=${args.len()}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj", "alpha", "beta"]
stdout_has = ["argc=3"]

[[case]]
name = "run --interpret runs a project directory"
polarity = "positive"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n", "src/main.wj" = "fn main() {\n    println(\"from project\")\n}\n" }
args = ["run", "--interpret", "{w}"]
stdout_has = ["from project"]

[[case]]
name = "run --interpret reports a parse error and fails"
polarity = "negative"
covers = ["feature interpret-instant"]
files = { "m.wj" = "fn main( {\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 1
output_has = ["expected parameter name"]

[[case]]
name = "run --interpret of a missing file fails"
polarity = "negative"
args = ["run", "--interpret", "{w}/nope.wj"]
exit = 1
output_has = ["no such file or directory"]

[[case]]
name = "run --interpret propagates a panic as a failure"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"before\")\n    panic(\"boom\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
stdout_has = ["before"]
output_has = ["boom"]

[[case]]
name = "run --interpret rejects a string assigned to an int"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let x: int = \"s\"\n    println(\"${x}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 1
output_has = ["WJ0003", "not running", "the interpreter runs only programs the compiler accepts"]
output_lacks = ["\ns\n"]

[[case]]
name = "run --target javascript compiles and runs with node"
polarity = "positive"
needs = "toolchain"
files = { "m.wj" = "fn main() {\n    println(\"js ${6 * 7}\")\n}\n" }
args = ["run", "--target", "javascript", "{w}/m.wj"]
stdout_has = ["js 42"]

[[case]]
name = "run --target rejects an unknown target"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--target", "nope", "{w}/m.wj"]
output_has = ["nope"]

[[case]]
name = "run accepts --defer-drop modes"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["run", "--interpret", "--defer-drop", "always", "--defer-drop-threshold", "64", "{w}/m.wj"]
stdout_has = ["ok"]

[[case]]
name = "run --defer-drop-threshold must be a number"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--interpret", "--defer-drop-threshold", "x", "{w}/m.wj"]
exit = 2
output_has = ["invalid value 'x'"]

[[case]]
name = "run --defer-drop rejects an unknown mode"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--interpret", "--defer-drop", "bogus", "{w}/m.wj"]
exit = 2
output_has = ["invalid value 'bogus'"]

[[case]]
name = "repl evaluates statements from stdin"
polarity = "positive"
args = ["repl"]
stdin = "let x = 1 + 2\nprintln(\"${x}\")\n"
stdout_has = ["3"]

[[case]]
name = "repl reports an error for an undefined name"
polarity = "negative"
args = ["repl"]
stdin = "println(\"${nope_undefined}\")\n"
exit = 0
output_has = ["nope_undefined"]

[[case]]
name = "run --defer-drop still reports parse errors"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["run", "--interpret", "--defer-drop", "never", "{w}/m.wj"]
exit = 1

[[case]]
name = "run --deterministic-time makes the clock reproducible"
polarity = "positive"
files = { "m.wj" = "use std::thread\nuse std::time::{Duration, Instant}\n\nfn main() {\n    let a = Instant::now()\n    thread::sleep(Duration::from_millis(1500))\n    println(\"${a.elapsed():?}\")\n}\n" }
args = ["run", "--interpret", "--deterministic-time", "{w}/m.wj"]
stdout_has = ["1.5s"]

[[case]]
name = "run --deterministic-time still reports parse errors"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["run", "--interpret", "--deterministic-time", "{w}/m.wj"]
exit = 1

[[case]]
name = "run --interpret refuses network access by default"
polarity = "negative"
exit = 126
files = { "m.wj" = "use std::http\n\nfn main() {\n    match http::get(\"http://127.0.0.1:9/hello\") {\n        Ok(r) => println(\"${r.status_code()}\"),\n        Err(e) => println(\"ERR ${e}\"),\n    }\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
output_has = ["capability denied: net.connect(127.0.0.1)", "--allow net.connect=127.0.0.1", "[capabilities]"]

[[case]]
name = "run --allow-network performs real requests"
polarity = "positive"
files = { "m.wj" = "use std::http\n\nfn main() {\n    match http::get(\"http://127.0.0.1:9/hello\") {\n        Ok(r) => println(\"${r.status_code()}\"),\n        Err(e) => println(\"ERR ${e}\"),\n    }\n}\n" }
args = ["run", "--interpret", "--allow-network", "{w}/m.wj"]
stdout_has = ["ERR Connection refused"]
output_lacks = ["network access is disabled"]

[[case]]
name = "run --allow-network still reports parse errors"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["run", "--interpret", "--allow-network", "{w}/m.wj"]
exit = 1

[[case]]
name = "run --mock-http answers from canned responses"
polarity = "positive"
files = { "m.wj" = "use std::http\n\nfn main() {\n    match http::get(\"http://127.0.0.1:9/hello\") {\n        Ok(r) => println(\"${r.status_code()}\"),\n        Err(e) => println(\"ERR ${e}\"),\n    }\n}\n", "mock.json" = "[{\"method\":\"GET\",\"url\":\"http://127.0.0.1:9/hello\",\"status\":201,\"headers\":{},\"body\":\"c\"}]" }
args = ["run", "--interpret", "--mock-http", "{w}/mock.json", "{w}/m.wj"]
stdout_has = ["201"]

[[case]]
name = "run --mock-http fails on a missing mock file"
polarity = "negative"
files = { "m.wj" = "use std::http\n\nfn main() {\n    match http::get(\"http://127.0.0.1:9/hello\") {\n        Ok(r) => println(\"${r.status_code()}\"),\n        Err(e) => println(\"ERR ${e}\"),\n    }\n}\n" }
args = ["run", "--interpret", "--mock-http", "{w}/nope.json", "{w}/m.wj"]
exit = 1
output_has = ["cannot read mock file"]

[[case]]
name = "run --sched-seed selects a reproducible schedule"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["run", "--interpret", "--sched-seed", "3", "{w}/m.wj"]
stdout_has = ["ok"]

[[case]]
name = "run --sched-seed must be a number"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--interpret", "--sched-seed", "abc", "{w}/m.wj"]
exit = 2
output_has = ["invalid value 'abc'"]

[[case]]
name = "run --engine resolved executes a file"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--engine", "resolved", "{w}/m.wj"]
stdout_has = ["hello"]

[[case]]
name = "run --no-jit runs hot integer functions as closures"
polarity = "positive"
files = { "m.wj" = "fn sq(n: int) -> int {\n    n * n\n}\nfn main() {\n    let mut t = 0\n    let mut i = 0\n    while i < 200 {\n        t += sq(i)\n        i += 1\n    }\n    println(\"${t}\")\n}\n" }
args = ["run", "--interpret", "--no-jit", "{w}/m.wj"]
stdout_has = ["2646700"]

[[case]]
name = "run --no-jit still panics on integer overflow"
polarity = "negative"
files = { "m.wj" = "fn sq(n: int) -> int {\n    n * n\n}\nfn main() {\n    let mut i = 0\n    while i < 200 {\n        println(\"${sq(i * 100000000)}\")\n        i += 1\n    }\n}\n" }
args = ["run", "--interpret", "--no-jit", "{w}/m.wj"]
exit = 101
output_has = ["attempt to multiply with overflow"]

[[case]]
name = "run --jit off is the same as --no-jit"
polarity = "positive"
files = { "m.wj" = "fn sq(n: int) -> int {\n    n * n\n}\nfn main() {\n    let mut t = 0\n    let mut i = 0\n    while i < 200 {\n        t += sq(i)\n        i += 1\n    }\n    println(\"${t}\")\n}\n" }
args = ["run", "--interpret", "--jit", "off", "{w}/m.wj"]
stdout_has = ["2646700"]

[[case]]
name = "run --jit rejects an unknown value"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--jit", "maybe", "{w}/m.wj"]
exit = 1
output_has = ["unknown WJ_JIT / --jit value"]

[[case]]
name = "run --engine walker executes a file"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--engine", "walker", "{w}/m.wj"]
stdout_has = ["hello"]

[[case]]
name = "run --engine rejects an unknown engine"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--engine", "bogus", "{w}/m.wj"]
exit = 1
output_has = ["unknown --engine", "walker or resolved"]

[[case]]
name = "run --hash-seed runs the program with a perturbed hash order"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--hash-seed", "7", "{w}/m.wj"]
stdout_has = ["hello"]

[[case]]
name = "run --hash-seed rejects a non-numeric seed"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"hello\")\n}\n" }
args = ["run", "--interpret", "--hash-seed", "abc", "{w}/m.wj"]
exit = 2
output_has = ["invalid value 'abc' for '--hash-seed <N>'"]

[[case]]
name = "run --bin selects a named binary of the project"
polarity = "positive"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n", "src/main.wj" = "fn main() {\n    println(\"main\")\n}\n", "cmd/tool/main.wj" = "fn main() {\n    println(\"tool\")\n}\n" }
args = ["run", "--interpret", "--bin", "tool", "{w}"]
stdout_has = ["tool"]

[[case]]
name = "run --bin of an unknown name lists the available binaries"
polarity = "negative"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n", "src/main.wj" = "fn main() {\n    println(\"main\")\n}\n" }
args = ["run", "--interpret", "--bin", "nope", "{w}"]
exit = 1
output_has = ["no binary named `nope`"]

[[case]]
name = "run --interpret refuses a Rust-leakage lint error"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v: Option<int> = Some(1)\n    println(\"${v.unwrap()}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 1
output_has = ["W0002", "not running"]

[[case]]
name = "run --no-lint still refuses a real compile error"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["run", "--interpret", "--no-lint", "{w}/m.wj"]
exit = 1
output_has = ["expected parameter name"]

[[case]]
name = "run --no-lint runs a program despite a lint"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let v: Option<int> = Some(1)\n    println(\"${v.unwrap()}\")\n}\n" }
args = ["run", "--interpret", "--no-lint", "{w}/m.wj"]
stdout_has = ["1"]
