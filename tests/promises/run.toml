stderr_has = ["[jit] loop", "compiled"]

[[case]]
name = "run --jit-loop-hot rejects a non-number"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let mut t = 0\n    let mut i = 0\n    while i < 300 {\n        t += i * 3\n        i += 1\n    }\n    println(\"${t}\")\n}\n" }
