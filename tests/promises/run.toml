[[case]]
name = "run --verify: a field moved into a collection and the whole struct returned afterwards compiles (partial move copies the field)"
polarity = "positive"
needs = "toolchain"
files = { "m.wj" = "struct Edit {\n    idx: int,\n    text: string,\n}\n\nstruct Editor {\n    lines: Vec<string>,\n}\n\nimpl Editor {\n    fn forward(self, e: Edit) -> Edit {\n        let mut e2 = Edit { idx: e.idx, text: e.text }\n        if e2.idx == 0 {\n            self.lines.push(e2.text)\n        } else {\n            self.lines[0] = e2.text\n        }\n        e2\n    }\n}\n\nfn main() {\n    let mut ed = Editor { lines: [\"x\"] }\n    let e = ed.forward(Edit { idx: 1, text: \"y\" })\n    println(\"${ed.lines.len()} ${e.idx}\")\n}\n" }
args = ["run", "--verify", "{w}/m.wj"]
exit = 0
stdout_has = ["1 1"]
stderr_has = ["wj verify: OK"]

[[case]]
