[[case]]
name = "run --stdin-file gives a file as standard input"
polarity = "positive"
files = { "m.wj" = "use std::fs\n\nfn main() {\n    let text = fs::read_to_string(\"/dev/stdin\").unwrap_or(\"\")\n    println(\"got ${text.trim()}\")\n}\n", "in.txt" = "=A1*3\n" }
args = ["run", "--interpret", "--stdin-file", "{w}/in.txt", "{w}/m.wj"]
stdout_has = ["got =A1*3"]

[[case]]
name = "run --stdin-file with a missing file fails with its name"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"x\")\n}\n" }
args = ["run", "--interpret", "--stdin-file", "{w}/nope.txt", "{w}/m.wj"]
exit = 1
output_has = ["--stdin-file", "nope.txt"]

[[case]]
name = "run --pair-list runs each listed program under both engines and prints a JSON line each"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"pair-ok\")\n}\n", "list.txt" = "{w}/m.wj\n" }
args = ["run", "--pair-list", "{w}/list.txt"]
stdout_has = ["\"engine\":\"walker\"", "\"engine\":\"resolved\"", "pair-ok"]

[[case]]
name = "run --pair-list of a missing list file fails"
polarity = "negative"
args = ["run", "--pair-list", "{w}/nope.txt"]
exit = 1
output_has = ["cannot read"]

[[case]]
name = "run --fix applies the WJ0035 fix, then runs the program"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let parts = \"a b c\".split(\" \")\n    println(\"first=${parts[0]}\")\n}\n" }
args = ["run", "--interpret", "--fix", "{w}/m.wj"]
stdout_has = ["first=a"]

[[case]]
name = "run without --fix reports WJ0035 and does not run"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let parts = \"a b c\".split(\" \")\n    println(\"first=${parts[0]}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 1
output_has = ["WJ0035", "collect"]
