# Acceptance cases for effects and capabilities (ADR-0021): `wj explain-effects`, `wj run --sandbox/--allow`.

[[case]]
name = "explain-effects shows the effect, the chain to the sink and the rule"
polarity = "positive"
files = { "m.wj" = "use std::fs\n\nfn load() -> string {\n    fs::read_to_string(\"cfg.toml\").unwrap_or(\"\")\n}\n\nfn main() {\n    println(load())\n}\n" }
args = ["explain-effects", "{w}/m.wj"]
stdout_has = ["load: fs.read", "main: console, fs.read", "main -> load -> fs::read_to_string", "SPEC-EFF-002"]

[[case]]
name = "explain-effects reports a parse error"
polarity = "negative"
files = { "m.wj" = "fn main( {\n" }
args = ["explain-effects", "{w}/m.wj"]
exit = 1
output_has = ["Expected parameter name"]

[[case]]
name = "explain-effects --fn limits output to one function"
polarity = "positive"
files = { "m.wj" = "use std::random\n\nfn roll() -> int {\n    random::range(1, 7)\n}\n\nfn main() {\n    println(\"${roll()}\")\n}\n" }
args = ["explain-effects", "{w}/m.wj", "--fn", "roll"]
stdout_has = ["roll: random"]
output_lacks = ["main:"]

[[case]]
name = "explain-effects --fn rejects an unknown function"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["explain-effects", "{w}/m.wj", "--fn", "nope"]
exit = 1
output_has = ["no function named `nope`"]

[[case]]
name = "explain-effects --json lists functions and their effects"
polarity = "positive"
files = { "m.wj" = "use std::random\n\nfn roll() -> int {\n    random::range(1, 7)\n}\n\nfn main() {\n    println(\"${roll()}\")\n}\n" }
args = ["explain-effects", "{w}/m.wj", "--json"]
json = true
stdout_has = ["\"function\": \"roll\"", "\"effect\": \"random\""]

[[case]]
name = "run --sandbox stops a program that reads a file with exit status 126"
polarity = "negative"
covers = ["wj run --sandbox"]
files = { "m.wj" = "use std::fs\n\nfn main() {\n    println(\"start\")\n    let r = fs::read_to_string(\"/etc/hosts\")\n    println(\"leaked ${r.is_ok()}\")\n}\n" }
args = ["run", "--interpret", "--sandbox", "{w}/m.wj"]
exit = 126
stdout_has = ["start"]
output_has = ["capability denied: fs.read(/etc/hosts)", "--allow fs.read=/etc/hosts"]
output_lacks = ["leaked"]

[[case]]
name = "run --sandbox still allows pure computation, time and random"
polarity = "positive"
covers = ["wj run --sandbox"]
files = { "m.wj" = "use std::random\n\nfn main() {\n    let n = random::range(0, 10)\n    println(\"ok ${n < 10}\")\n}\n" }
args = ["run", "--interpret", "--sandbox", "{w}/m.wj"]
stdout_has = ["ok true"]

[[case]]
name = "run --allow grants one effect to a sandboxed run"
polarity = "positive"
covers = ["wj run --allow"]
files = { "m.wj" = "use std::fs\n\nfn main() {\n    println(\"exists ${fs::exists(\"/etc/hosts\")}\")\n}\n" }
args = ["run", "--interpret", "--sandbox", "--allow", "fs.read=/etc/hosts", "{w}/m.wj"]
stdout_has = ["exists true"]

[[case]]
name = "run --allow rejects an unknown effect name"
polarity = "negative"
covers = ["wj run --allow"]
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--interpret", "--allow", "net.conect=x", "{w}/m.wj"]
exit = 1
output_has = ["unknown effect `net.conect`"]

[[case]]
name = "run refuses a project whose literal host is outside [capabilities] (WJ0041, before anything runs)"
polarity = "negative"
covers = ["wj run --allow"]
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n\n[capabilities]\nnet.connect = [\"api.example.com\"]\n", "src/main.wj" = "use std::http\n\nfn main() {\n    let r = http::get(\"http://other.example/\")\n    println(\"done ${r.is_ok()}\")\n}\n" }
args = ["run", "--interpret", "{w}"]
exit = 1
output_has = ["WJ0041", "net.connect(other.example)` is outside the grant"]
output_lacks = ["done"]

[[case]]
name = "a computed host outside [capabilities] is stopped at run time with exit status 126"
polarity = "negative"
covers = ["wj run --allow"]
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n\n[capabilities]\nnet.connect = [\"api.example.com\"]\n", "src/main.wj" = "use std::http\n\nfn main() {\n    let host = \"other\" + \".example\"\n    println(\"start\")\n    let r = http::get(\"http://\" + host + \"/\")\n    println(\"done ${r.is_ok()}\")\n}\n" }
args = ["run", "--interpret", "{w}"]
exit = 126
stdout_has = ["start"]
output_has = ["capability denied: net.connect(other.example)"]
output_lacks = ["done"]

[[case]]
name = "run --caps enforce stops a call outside the local profile; warn lets it through"
polarity = "negative"
covers = ["wj run --caps"]
files = { "m.wj" = "use std::fs\n\nfn main() {\n    println(\"exists ${fs::exists(\"/etc/hosts\")}\")\n}\n" }
args = ["run", "--interpret", "--caps", "enforce", "{w}/m.wj"]
exit = 126
output_has = ["capability denied: fs.read(/etc/hosts)"]

[[case]]
name = "run --caps warn runs the call and says what would be denied"
polarity = "positive"
covers = ["wj run --caps"]
files = { "m.wj" = "use std::fs\n\nfn main() {\n    println(\"exists ${fs::exists(\"/etc/hosts\")}\")\n}\n" }
args = ["run", "--interpret", "--caps", "warn", "{w}/m.wj"]
stdout_has = ["exists true"]
output_has = ["warning[WJ0040]", "fs.read(/etc/hosts)"]

[[case]]
name = "explain-effects --json reports a parse error"
polarity = "negative"
covers = ["wj explain-effects --json"]
files = { "m.wj" = "fn main( {\n" }
args = ["explain-effects", "{w}/m.wj", "--json"]
exit = 1
output_has = ["Expected parameter name"]

[[case]]
name = "wj check reports an effect the manifest does not grant (WJ0040) with the call chain"
polarity = "negative"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n\n[capabilities]\n", "src/main.wj" = "use std::process\n\nfn run_it() -> bool {\n    process::run(\"ls\").is_ok()\n}\n\nfn main() {\n    println(\"${run_it()}\")\n}\n" }
args = ["check", "{w}"]
exit = 1
output_has = ["WJ0040", "effect `process` is not granted", "main -> run_it -> process::run"]

[[case]]
name = "caps show lists what a dependency does and whether the lock covers it"
polarity = "positive"
covers = ["wj caps", "wj caps --json"]
files = { "app/wj.toml" = "[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nlib = { path = \"../lib\" }\n\n[capabilities]\nfs.read = [\"./**\"]\n", "app/src/main.wj" = "use lib\n\nfn main() {\n    println(\"${lib::size(\"abc\")}\")\n}\n", "lib/wj.toml" = "[package]\nname = \"lib\"\nversion = \"0.1.0\"\n", "lib/src/lib.wj" = "use std::fs\n\npub fn size(s: string) -> int {\n    s.len()\n}\n\npub fn load(p: string) -> string {\n    fs::read_to_string(p).unwrap_or(\"\")\n}\n" }
args = ["caps", "show", "{w}/app", "--json"]
json = true
stdout_has = ["\"package\": \"lib\"", "fs.read(*)", "no lock file"]

[[case]]
name = "caps approve writes the lock file and check then passes"
polarity = "positive"
covers = ["wj caps"]
files = { "app/wj.toml" = "[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nlib = { path = \"../lib\" }\n\n[capabilities]\nfs.read = [\"./**\"]\n", "app/src/main.wj" = "use lib\n\nfn main() {\n    println(\"${lib::size(\"abc\")}\")\n}\n", "lib/wj.toml" = "[package]\nname = \"lib\"\nversion = \"0.1.0\"\n", "lib/src/lib.wj" = "use std::fs\n\npub fn size(s: string) -> int {\n    s.len()\n}\n\npub fn load(p: string) -> string {\n    fs::read_to_string(p).unwrap_or(\"\")\n}\n" }
args = ["caps", "approve", "{w}/app"]
stdout_has = ["wrote", ".wj-capabilities.lock"]

[[case]]
name = "caps rejects an unknown action"
polarity = "negative"
covers = ["wj caps"]
files = { "m.wj" = "fn main() {\n}\n" }
args = ["caps", "forget", "{w}"]
exit = 2
output_has = ["invalid value 'forget'"]

[[case]]
name = "check names the dependency whose effect is not granted"
polarity = "negative"
covers = ["wj caps"]
files = { "app/wj.toml" = "[package]\nname = \"app\"\nversion = \"0.1.0\"\n\n[dependencies]\nlib = { path = \"../lib\" }\n\n[capabilities]\nfs.read = [\"./**\"]\n", "app/src/main.wj" = "use lib\n\nfn main() {\n    println(lib::load(\"x\"))\n}\n", "lib/wj.toml" = "[package]\nname = \"lib\"\nversion = \"0.1.0\"\n", "lib/src/lib.wj" = "use std::fs\n\npub fn load(p: string) -> string {\n    fs::read_to_string(p).unwrap_or(\"\")\n}\n" }
args = ["check", "{w}/app"]
exit = 1
output_has = ["not granted to dependency `lib`", "wj caps approve"]

[[case]]
name = "caps show --json of a directory with no sources fails"
polarity = "negative"
covers = ["wj caps --json"]
files = { "notes.txt" = "nothing to analyze\n" }
args = ["caps", "show", "{w}", "--json"]
exit = 1
output_has = ["no .wj files"]

[[case]]
name = "run --record runs the program and writes the log"
polarity = "positive"
files = { "m.wj" = "use std::fs\n\nfn main() {\n    fs::write(\"o.txt\", \"x\").unwrap_or(())\n    println(\"recorded\")\n}\n" }
args = ["run", "--interpret", "--no-lint", "--record", "{w}/run.wjlog", "{w}/m.wj"]
stdout_has = ["recorded"]

[[case]]
name = "run --replay fails on a missing log"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println(\"x\")\n}\n" }
args = ["run", "--interpret", "--replay", "{w}/nope.wjlog", "{w}/m.wj"]
exit = 1
output_has = ["cannot read effect log"]

[[case]]
name = "run --replay and --record are exclusive"
polarity = "negative"
files = { "m.wj" = "fn main() {\n}\n" }
args = ["run", "--interpret", "--record", "{w}/a.wjlog", "--replay", "{w}/a.wjlog", "{w}/m.wj"]
exit = 2
output_has = ["cannot be used with"]

[[case]]
name = "run --replay re-runs a program from its log"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"replayed\")\n}\n", "r.wjlog" = "{\"args\":[],\"compiler\":\"0.50.0\",\"det_time\":false,\"hash_seed\":0,\"program\":\"x\",\"rng_seed\":1,\"sched_seed\":0,\"sim_seed\":null,\"wj_effect_log\":1}\n" }
args = ["run", "--interpret", "--replay", "{w}/r.wjlog", "{w}/m.wj"]
stdout_has = ["replayed"]

