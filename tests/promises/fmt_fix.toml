# Acceptance cases for `wj fmt` and `wj fix` (tests/promise_registry_test.rs).

[[case]]
name = "fmt rewrites a file in place"
polarity = "positive"
files = { "m.wj" = "fn main() {\nlet x=1\n    println(\"${x}\")\n}\n" }
args = ["fmt", "{w}/m.wj"]
file_has = { "m.wj" = "    let x = 1\n" }

[[case]]
name = "fmt of a missing path fails"
polarity = "negative"
args = ["fmt", "{w}/nope.wj"]
exit = 1
output_has = ["path not found"]

[[case]]
name = "fmt - formats stdin to stdout"
polarity = "positive"
args = ["fmt", "-"]
stdin = "fn main() {\nlet x=1\n    println(\"${x}\")\n}\n"
stdout_has = ["fn main() {\n    let x = 1\n"]

[[case]]
name = "fmt - refuses input that does not parse"
polarity = "negative"
args = ["fmt", "-"]
stdin = "fn main( {\n"
exit = 1
output_has = ["does not parse"]

[[case]]
name = "fmt --check accepts formatted code"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let x = 1\n    println(\"${x}\")\n}\n" }
args = ["fmt", "--check", "{w}/m.wj"]

[[case]]
name = "fmt --check fails on unformatted code without touching it"
polarity = "negative"
files = { "m.wj" = "fn main() {\nlet x=1\n}\n" }
args = ["fmt", "--check", "{w}/m.wj"]
exit = 1
output_has = ["need formatting"]
file_has = { "m.wj" = "let x=1" }

[[case]]
name = "fmt --rust formats the Rust crate in the current directory"
polarity = "positive"
needs = "toolchain"
files = { "c/Cargo.toml" = "[package]\nname = \"c\"\nversion = \"0.1.0\"\nedition = \"2021\"\n", "c/src/main.rs" = "fn main(){println!(\"x\");}\n" }
cwd = "c"
args = ["fmt", "--rust"]
file_has = { "c/src/main.rs" = "fn main() {" }

[[case]]
name = "fmt --rust formats the crate given as a path"
polarity = "positive"
needs = "toolchain"
files = { "c/Cargo.toml" = "[package]\nname = \"c\"\nversion = \"0.1.0\"\nedition = \"2021\"\n", "c/src/main.rs" = "fn main(){println!(\"x\");}\n" }
args = ["fmt", "--rust", "{w}/c"]
file_has = { "c/src/main.rs" = "fn main() {" }

[[case]]
name = "fmt --rust fails outside a Rust crate"
polarity = "negative"
needs = "toolchain"
files = { "d/readme.txt" = "x" }
args = ["fmt", "--rust", "{w}/d"]

[[case]]
name = "fix migrates deprecated macros in place"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let v = vec![1, 2]\n    println!(\"{}\", v.len())\n}\n" }
args = ["fix", "{w}/m.wj"]
file_has = { "m.wj" = "println(\"${v.len()}\")" }
output_has = ["2 rewrite(s)"]

[[case]]
name = "fix migrates vec! where a declared Vec type fixes the list type (argument, return, assignment)"
polarity = "positive"
files = { "m.wj" = "pub struct Box {\n    pub xs: Vec<int>,\n}\n\nfn total(xs: Vec<int>) -> int {\n    xs.len()\n}\n\nfn make() -> Vec<int> {\n    vec![4, 5]\n}\n\nfn main() {\n    let mut b = Box { xs: [] }\n    b.xs = vec![1]\n    let n = total(vec![1, 2])\n    println(\"${n} ${make().len()} ${b.xs.len()}\")\n}\n" }
args = ["fix", "{w}/m.wj"]
file_has = { "m.wj" = "total([1, 2])" }
output_has = ["3 rewrite(s)"]

[[case]]
name = "fix keeps vec! where no declared Vec type reaches the position and says how to resolve it"
polarity = "positive"
files = { "m.wj" = "fn id<T>(x: T) -> T {\n    x\n}\n\nfn main() {\n    let n = id(vec![1, 2]).len()\n    println(\"${n}\")\n}\n" }
args = ["fix", "{w}/m.wj"]
file_has = { "m.wj" = "id(vec![1, 2])" }
output_has = ["no declared `Vec<T>` type reaches this position", "1 occurrence(s) need manual migration"]

[[case]]
name = "fix --check fails on a vec! argument of a declared Vec formal and does not write"
polarity = "negative"
files = { "m.wj" = "fn total(xs: Vec<int>) -> int {\n    xs.len()\n}\n\nfn main() {\n    let n = total(vec![1, 2])\n    println(\"${n}\")\n}\n" }
args = ["fix", "--check", "{w}/m.wj"]
exit = 1
file_has = { "m.wj" = "total(vec![1, 2])" }

[[case]]
name = "fix of a missing path fails"
polarity = "negative"
args = ["fix", "{w}/nope.wj"]
exit = 1
output_has = ["Path does not exist"]

[[case]]
name = "fix --check passes migrated code"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    println(\"ok\")\n}\n" }
args = ["fix", "--check", "{w}/m.wj"]

[[case]]
name = "fix --check fails on deprecated code and does not write"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    println!(\"{}\", 1)\n}\n" }
args = ["fix", "--check", "{w}/m.wj"]
exit = 1
file_has = { "m.wj" = "println!(" }

[[case]]
name = "fix --docs migrates code fences in Markdown"
polarity = "positive"
files = { "d.md" = "# t\n\n```windjammer\nfn main() {\n    println!(\"hi\")\n}\n```\n" }
args = ["fix", "--docs", "{w}/d.md"]
file_has = { "d.md" = "    println(\"hi\")" }

[[case]]
name = "fix --docs --check fails on deprecated fences"
polarity = "negative"
files = { "d.md" = "# t\n\n```windjammer\nfn main() {\n    println!(\"hi\")\n}\n```\n" }
args = ["fix", "--docs", "--check", "{w}/d.md"]
exit = 1
file_has = { "d.md" = "println!(" }

[[case]]
name = "fix declares mut on a local the program changes (WJ0051)"
polarity = "positive"
files = { "m.wj" = "fn main() {\n    let v = Vec::new()\n    v.push(1)\n    println(\"${v.len()}\")\n}\n" }
args = ["fix", "{w}/m.wj"]
file_has = { "m.wj" = "let mut v = Vec::new()" }
output_has = ["`v` is changed: `mut` added (WJ0051)"]

[[case]]
name = "fix --check fails on a local changed without mut (WJ0051) and does not write"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    let v = Vec::new()\n    v.push(1)\n    println(\"${v.len()}\")\n}\n" }
args = ["fix", "--check", "{w}/m.wj"]
exit = 1
file_has = { "m.wj" = "let v = Vec::new()" }
output_has = ["`v` is changed: `mut` is missing (WJ0051)"]

[[case]]
name = "fix --docs declares mut in code fences"
polarity = "positive"
files = { "d.md" = "# t\n\n```wj\nfn main() {\n    let n = 0\n    n += 1\n    println(\"${n}\")\n}\n```\n" }
args = ["fix", "--docs", "{w}/d.md"]
file_has = { "d.md" = "    let mut n = 0" }

[[case]]
name = "fix migrates thread blocks and channel operators to the ADR-0004 surface (WJ0191, WJ0190)"
polarity = "positive"
files = { "m.wj" = "use std::sync\nfn main() {\n    let (tx, rx) = sync::channel()\n    thread {\n        tx <- 1\n    }\n    let v = <-rx\n    println(\"${v}\")\n}\n" }
args = ["fix", "{w}/m.wj"]
file_has = { "m.wj" = "    scope {\n        spawn {\n            tx.send(1)\n        }\n        let v = rx.recv()\n" }

[[case]]
name = "fix --check fails on a removed thread block (WJ0191) and does not write"
polarity = "negative"
files = { "m.wj" = "fn main() {\n    thread {\n        println(\"x\")\n    }\n}\n" }
args = ["fix", "--check", "{w}/m.wj"]
exit = 1
file_has = { "m.wj" = "thread {" }

[[case]]
name = "fix adds the pub use line a module needs to re-export its child's item (WJ0194)"
polarity = "positive"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n", "src/main.wj" = "mod adapters\n\nfn main() {\n    println(\"${adapters::serve()}\")\n}\n", "src/adapters/mod.wj" = "pub mod http\n", "src/adapters/http.wj" = "pub fn serve() -> int {\n    7\n}\n" }
args = ["fix", "{w}/src"]
file_has = { "src/adapters/mod.wj" = "pub use http::serve" }

[[case]]
name = "fix --check fails while a module lacks a pub use line (WJ0194) and does not write"
polarity = "negative"
files = { "wj.toml" = "[package]\nname = \"p\"\nversion = \"0.1.0\"\n", "src/main.wj" = "mod adapters\n\nfn main() {\n    println(\"${adapters::serve()}\")\n}\n", "src/adapters/mod.wj" = "pub mod http\n", "src/adapters/http.wj" = "pub fn serve() -> int {\n    7\n}\n" }
args = ["fix", "--check", "{w}/src"]
exit = 1
file_has = { "src/adapters/mod.wj" = "pub mod http" }
