# Acceptance cases for the interpreter's trust contract (docs/testing/INTERPRETER_CONTRACT.md): what the interpreter
# accepts it runs faithfully, and what rustc would reject on ownership grounds it refuses before running.

[[case]]
name = "an accepted program prints what the language defines, including panic exit status"
polarity = "positive"
covers = ["feature interpreter-matches-compiled"]
files = { "m.wj" = "fn level(n: int) -> int {\n    if n == 0 {\n        panic(\"bottom\")\n    }\n    level(n - 1) + 1\n}\n\nfn main() {\n    println(\"wrapping ${200_u8.wrapping_add(100_u8)} cast ${300 as u8} div ${-7 / 2} rem ${-7 % 3}\")\n    println(\"${level(3)}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 101
stdout_has = ["wrapping 44 cast 44 div -3 rem -1"]
output_has = ["bottom"]

[[case]]
name = "a value that cannot be copied is refused before running when it is used after being given away (WJ0007, as rustc E0382)"
polarity = "negative"
covers = ["feature interpreter-matches-compiled"]
files = { "m.wj" = "use std::sync::mpsc\n\nstruct Inbox {\n    rx: mpsc::Receiver<int>,\n    seen: int,\n}\n\nfn drain(inbox: Inbox) -> int {\n    let r = inbox.rx\n    inbox.seen\n}\n\nfn main() {\n    let pair = mpsc::channel()\n    let inbox = Inbox { rx: pair.1, seen: 0 }\n    let n = drain(inbox)\n    println(\"${n} ${inbox.seen}\")\n}\n" }
args = ["run", "--interpret", "{w}/m.wj"]
exit = 1
output_has = ["WJ0007"]
