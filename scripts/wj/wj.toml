[package]
name = "wj-scripts"
version = "0.1.0"
edition = "2025"

# Repository tooling, run with `wj run scripts/wj/<script>.wj [args]`. The packages come from
# windjammer-ecosystem: set WJ_ECOSYSTEM to a checkout of it, or check it out (or symlink it) at the repository
# root as `windjammer-ecosystem/` (the default). `wj check` names the variable when the packages are missing.
[dependencies]
wj_cli_args = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-cli-args" }
wj_json_doc = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-json-doc" }
wj_table = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-table" }
wj_stats = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-stats" }
wj_proc = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-proc" }
wj_fs_walk = { path = "${WJ_ECOSYSTEM:-../../windjammer-ecosystem}/packages/wj-fs-walk" }

# One grant covers every script in this directory (the union of what they need): the repository
# (scripts run from its root), scratch space under /tmp and the system temp directory (`$TMP`: on macOS it is
# /var/folders/.., not /tmp), and the programs they start themselves.
[capabilities]
fs.read = ["./**", "../../**", "/tmp/**", "$TMP/**"]
# generated sources and manifests are named by suffix (`*.wj`, `wj.toml`): the pattern says so out loud, a bare `**` never reaches them
# `add_missing_mut.wj` edits the repository's sources in place (`../../**/*.wj`)
fs.write = ["./**", "../../**", "/tmp/**", "$TMP/**", "../../tests/check_negative/mutants/*.wj", "../../**/*.wj", "/tmp/**/*.wj", "/tmp/**/wj.toml", "$TMP/**/*.wj", "$TMP/**/wj.toml"]
process = ["bash", "cargo", "sh", "git"]
env.read = ["*"]

# Packages get their own, narrower grants.
[capabilities.dependencies.wj_fs_walk]
fs.read = ["./**", "../../**", "/tmp/**", "$TMP/**"]

[capabilities.dependencies.wj_proc]
# `env` and `sh` stand in for the program a script is told to drive (a path cannot be named in a grant)
process = ["git", "sh", "python3", "env", "/usr/bin/time", "rustc"]
