[package]
name = "book-samples"
version = "0.1.0"
edition = "2025"

# Runs the book's samples (scripts/book/MODULE.md). Reads the extracted samples, writes scratch projects, starts `wj`.
[capabilities]
fs.read = ["./**", "/tmp/**", "/private/tmp/**", "$TMP/**"]
fs.write = ["./docs/generated/measured.json", "../../docs/generated/measured.json", "/tmp/**", "/private/tmp/**", "$TMP/**", "/tmp/**/*.wj", "/tmp/**/wj.toml", "/private/tmp/**/*.wj", "/private/tmp/**/wj.toml", "$TMP/**/*.wj", "$TMP/**/wj.toml"]
process = ["sh", "env", "time", "/usr/bin/time", "rm", "mkdir", "uname"]
env.read = ["*"]
