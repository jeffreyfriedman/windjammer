[workspace]
members = [
    ".",
    "crates/windjammer-lsp",
    "crates/windjammer-mcp",
    "crates/windjammer-runtime",
]

[workspace.package]
version = "0.50.0"
edition = "2021"
authors = ["Jeffrey Friedman <20387583+jeffreyfriedman@users.noreply.github.com>", "Windjammer Contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[package]
name = "windjammer"
version.workspace = true
edition.workspace = true
default-run = "wj"
authors.workspace = true
license.workspace = true
description = "Windjammer: 80% of Rust's power with 20% of its complexity. A high-level language that compiles to Rust with inferred ownership; runs instantly in an interpreter and also targets Go, JavaScript and WebAssembly."
repository = "https://github.com/jeffreyfriedman/windjammer"
homepage = "https://github.com/jeffreyfriedman/windjammer"
documentation = "https://github.com/jeffreyfriedman/windjammer/blob/main/docs/index.md"
keywords = ["compiler", "transpiler", "language", "ownership", "interpreter"]
categories = ["compilers", "development-tools"]
readme = "README.md"
rust-version.workspace = true
autobins = false
autotests = false
include = [
    "src/**/*",
    "std/**/*",
    "stdlib_meta/**/*",
    "agent_index/**/*",
    "templates/**/*",
    "crates/windjammer-runtime/Cargo.toml",
    "crates/windjammer-runtime/src/**/*",
    "build_support/**/*",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[lib]
name = "windjammer"
path = "src/lib.rs"

[[bin]]
name = "wj"
path = "src/bin/wj.rs"
required-features = ["cli"]

[[bin]]
name = "wj-lint"
path = "src/bin/wj-lint.rs"

# Documentation generator/verifier (docs/CONTRIBUTING-docs.md); sources in tools/docs_truth/.
[[bin]]
name = "wj-docs"
path = "src/bin/wj-docs.rs"
required-features = ["cli"]

[[bin]]
name = "windjammer"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "safety_typed_ir", "jit"]
cli = ["dep:syntect", "dep:tempfile", "dep:salsa", "dep:env_logger", "highlighting"]
highlighting = ["dep:syntect"]
optimizer-soak = []
# Interpreter: Cranelift tier for hot integer functions (ADR-0020 step 7; on by default, `wj run --no-jit`
# or WJ_JIT=0 turns it off at run time; lib-only builds such as `--no-default-features --features cli` omit it).
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]
# std::arena (ADR-0016): arena types, escape check, interpreter support. Unstable surface.
unstable_arenas = []
# Safety-Typed IR: next-gen compiler pipeline with unified constraint solving,
# ownership/effect/taint as first-class types, and multi-target safety encodings.
safety_typed_ir = []
# Backend conformance soak mode: 5,000 generated programs instead of 200 (tests/backend_conformance_test.rs).
conformance_soak = []
# Opt-in test suite targets: `cargo test --features parser_tests`, etc.
# With no *_tests feature enabled, `cargo test` runs the full suite.
parser_tests = []
analyzer_tests = []
codegen_tests = []
interpreter_tests = []
conformance_tests = []
integration_tests = []
# Skip slow fixture integration tests (cargo test subprocesses).
# Use for fast iteration: cargo test --release --test all --features skip_fixtures
skip_fixtures = []

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
typed-arena = "2.0"
colored = "2.0"
chrono = "0.4"
# interpreter std modules (regex, crypto, csv, url): same crates the runtime uses
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
mime_guess = "2"
serde_yaml = "0.9"
flate2 = "1"
bcrypt = "0.17"
argon2 = { version = "0.5", features = ["std", "password-hash", "rand"] }
jsonwebtoken = "9"
url = "2"
csv = "1"
# std::db in the interpreter (SQLite; the same library sqlx bundles for windjammer-runtime)
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
once_cell = "1.19"
rayon = "1.10"
smallvec = "1.13"
syn = { version = "2", default-features = false, features = ["full", "parsing", "visit", "printing", "clone-impls", "proc-macro"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
libloading = "0.8"
cranelift-codegen = { version = "0.130", optional = true }
cranelift-frontend = { version = "0.130", optional = true }
cranelift-jit = { version = "0.130", optional = true }
cranelift-module = { version = "0.130", optional = true }
cranelift-native = { version = "0.130", optional = true }

tempfile = { version = "3.10", optional = true }
syntect = { version = "5.2", optional = true }
salsa = { version = "0.24", optional = true }
env_logger = { version = "0.11", optional = true }

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "2.0"
criterion = "0.5"
serde_json = "1.0"

[[example]]
name = "optimize_rs"
path = "benchmarks/rust_parity/optimize_rs.rs"

[[test]]
name = "check_negative_gate"
path = "tests/check_negative_gate.rs"

[[test]]
name = "diagnostics_suite"
path = "tests/diagnostics_suite.rs"

[[test]]
name = "all"
path = "tests/all.rs"

# Backend conformance (Rust/Go/JS) also runs standalone for fast iteration and CI sharding:
#   cargo test --release --test backend_conformance
[[test]]
name = "backend_conformance"
path = "tests/backend_conformance_test.rs"

# Convergence gates (golden emitted Rust, rustc-accepts, explain ratchet) also run standalone:
#   cargo test --release --test convergence_gates
[[test]]
name = "convergence_gates"
path = "tests/convergence_gates_test.rs"

# Stale .wj.meta sidecars must not change answers: cargo test --release --test meta_sidecar_consistency
[[test]]
name = "meta_sidecar_consistency"
path = "tests/meta_sidecar_consistency_test.rs"

# ADR-0017 portable consumption of semantic facts: cargo test --release --test semantic_facts_portable
[[test]]
name = "semantic_facts_portable"
path = "tests/semantic_facts_portable_test.rs"

# Inference differential harness standalone: cargo test --release --test inference_differential
[[test]]
name = "inference_differential"
path = "tests/inference_differential_test.rs"

# Language specification (docs/spec): executable rule examples. The grammar is checked by docs_truth.
#   cargo test --release --test spec_conformance
[[test]]
name = "spec_conformance"
path = "tests/spec_conformance_test.rs"

# Effects and capabilities (ADR-0021): sandbox escape suite (E1 gate: >= 60 cases, 0 escapes)
#   cargo test --release --test effects_escape
[[test]]
name = "effects_escape"
path = "tests/effects_escape_test.rs"

# Effects soundness over the spec corpus: every effect performed at run time is in the inferred static set
#   cargo test --release --test effects_soundness
[[test]]
name = "effects_soundness"
path = "tests/effects_soundness_test.rs"

# Docs truth also runs standalone: cargo test --release --test docs_truth
[[test]]
name = "docs_truth"
path = "tests/docs_truth_test.rs"
required-features = ["cli"]

# Every example under examples/ is run or checked (examples/EXAMPLES.toml): cargo test --release --test examples_gate
[[test]]
name = "examples_gate"
path = "tests/examples_gate_test.rs"
required-features = ["cli"]

# Standalone runs of the hygiene gates (also part of `all`): cargo test --release --test interpreter_features --test parser_arena_soundness
[[test]]
name = "interpreter_features"
path = "tests/interpreter_features_test.rs"

[[test]]
name = "interpreter_projects"
path = "tests/interpreter_projects_test.rs"

[[test]]
name = "parser_arena_soundness"
path = "tests/parser_arena_soundness_test.rs"

[[test]]
name = "optimizer_scratch_reuse"
path = "tests/optimizer_scratch_reuse_test.rs"

[[test]]
name = "arena_capability"
path = "tests/arena_capability_test.rs"
required-features = ["unstable_arenas"]

[[test]]
name = "arena_rust_backend"
path = "tests/arena_rust_backend_test.rs"
required-features = ["unstable_arenas"]

[[test]]
name = "interpreter_program_lifetime"
path = "tests/interpreter_program_lifetime_test.rs"

[[test]]
name = "arena_backends"
path = "tests/arena_backends_test.rs"
required-features = ["unstable_arenas"]

[[test]]
name = "parser_arena_memory"
path = "tests/parser_arena_memory_test.rs"

[[bench]]
name = "parser_throughput"
harness = false

# Codegen correctness gates (compiled Rust vs interpreter): also standalone for fast iteration.
[[test]]
name = "codegen_correctness"
path = "tests/codegen_correctness_test.rs"

# Ecosystem porting findings (docs/known-issues): cargo test --release --test ecosystem_findings
[[test]]
name = "ecosystem_findings"
path = "tests/ecosystem_findings_test.rs"

[[test]]
name = "std_interpreter_agreement"
path = "tests/std_interpreter_agreement_test.rs"

[[test]]
name = "ecosystem_findings2_interp"
path = "tests/ecosystem_findings2_interp_test.rs"

[[test]]
name = "ecosystem_findings2"
path = "tests/ecosystem_findings2_test.rs"

[[test]]
name = "ecosystem_findings_handoff"
path = "tests/ecosystem_findings_handoff_test.rs"

[[bench]]
name = "string_optimization_bench"
harness = false

[[bench]]
name = "simd_vectorization_bench"
harness = false

[[bench]]
name = "cache_locality_aosoa_bench"
harness = false

[profile.dev]
# Smaller artifacts; still enough debuginfo for backtraces / line mapping.
debug = "line-tables-only"

[profile.release]
opt-level = 3
